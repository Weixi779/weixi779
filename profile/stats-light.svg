<svg xmlns="http://www.w3.org/2000/svg" width="720" height="254"
  viewBox="0 0 720 254" role="img" aria-labelledby="title description">
  <title id="title">Weixi779 GitHub activity</title>
  <desc id="description">
    Lifetime GitHub contribution statistics with private contributions shown separately.
  </desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .heading { fill: #181a1f; font-size: 17px; font-weight: 600; }
    .subtitle { fill: #70757f; font-size: 12px; }
    .icon {
      fill: none;
      stroke: #f05138;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.5;
    }
    .metric-value {
      fill: #202228;
      font-size: 21px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      opacity: 1;
      animation: reveal 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: var(--delay);
    }
    .metric-label { fill: #70757f; font-size: 12px; }
    @keyframes reveal {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .metric-value { opacity: 1; animation: none; }
    }
  </style>
  <rect x="0.5" y="0.5" width="719" height="253" rx="18"
    fill="#ffffff" stroke="#e7e9ec"/>
  <rect x="32" y="22" width="28" height="28" rx="9" fill="#f05138"/>
  <path d="M38 36h3l1.8-3.5 2.6 7 1.8-3.5H54" fill="none" stroke="white"
    stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="heading" x="68" y="34">GitHub Activity</text>
  <text class="subtitle" x="68" y="52">Lifetime contribution summary</text>
  <line x1="360" y1="76" x2="360" y2="236" stroke="#eceef1"/>
  <line x1="32" y1="132" x2="328" y2="132" stroke="#eceef1"/>
  <line x1="32" y1="188" x2="328" y2="188" stroke="#eceef1"/>
  <line x1="392" y1="132" x2="688" y2="132" stroke="#eceef1"/>
  <line x1="392" y1="188" x2="688" y2="188" stroke="#eceef1"/>
  <g transform="translate(32 76)">
    <g class="icon" transform="translate(0 6)">

      <path d="M1 8h3l2.2-4.5 3.3 9 2.1-4.5H15"/>
    </g>
    <text class="metric-label" x="30" y="13">Total Contributions</text>
    <text class="metric-value" x="30" y="40" style="--delay: 0ms">1,493</text>
  </g>
  <g transform="translate(32 132)">
    <g class="icon" transform="translate(0 6)">

      <path d="M1 8h4M11 8h4"/>
      <circle cx="8" cy="8" r="3"/>
    </g>
    <text class="metric-label" x="30" y="13">Commit Contributions</text>
    <text class="metric-value" x="30" y="40" style="--delay: 65ms">776</text>
  </g>
  <g transform="translate(32 188)">
    <g class="icon" transform="translate(0 6)">

      <rect x="3" y="7" width="10" height="7" rx="2"/>
      <path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/>
    </g>
    <text class="metric-label" x="30" y="13">Private Contributions</text>
    <text class="metric-value" x="30" y="40" style="--delay: 130ms">664</text>
  </g>
  <g transform="translate(392 76)">
    <g class="icon" transform="translate(0 6)">

      <circle cx="4" cy="3" r="2"/>
      <circle cx="12" cy="13" r="2"/>
      <path d="M4 5v8M10 3h1a3 3 0 0 1 3 3v2M10 1l2 2-2 2"/>
    </g>
    <text class="metric-label" x="30" y="13">Pull Requests</text>
    <text class="metric-value" x="30" y="40" style="--delay: 195ms">14</text>
  </g>
  <g transform="translate(392 132)">
    <g class="icon" transform="translate(0 6)">

      <circle cx="8" cy="8" r="6"/>
      <path d="M8 4.5v4M8 11.5h.01"/>
    </g>
    <text class="metric-label" x="30" y="13">Issues</text>
    <text class="metric-value" x="30" y="40" style="--delay: 260ms">6</text>
  </g>
  <g transform="translate(392 188)">
    <g class="icon" transform="translate(0 6)">

      <path d="m8 1.5 2 4.1 4.5.7-3.3 3.2.8 4.5-4-2.1L4 14l.8-4.5-3.3-3.2 4.5-.7Z"/>
    </g>
    <text class="metric-label" x="30" y="13">Stars Earned</text>
    <text class="metric-value" x="30" y="40" style="--delay: 325ms">44</text>
  </g>
</svg>
